<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フェルミ推定クイズ</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-950 text-white min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-center mb-1 text-indigo-300">フェルミ推定 オーダーオブマグニチュード クイズ</h1>
  <p class="text-center text-indigo-500 mb-8 text-sm">概算力を鍛える — 10の何乗か当ててみよう</p>

  <!-- Start Screen -->
  <div id="startScreen" class="text-center">
    <div class="bg-indigo-900/50 border border-indigo-700 rounded-xl p-8 mb-6">
      <div class="text-6xl mb-4">🔭</div>
      <h2 class="text-xl font-bold text-indigo-300 mb-3">フェルミ物理学者への挑戦</h2>
      <p class="text-indigo-400 mb-6">20問の日本語フェルミ推定問題に挑戦します。<br>各問題に対し、指数を入力して(10^X の X を答える)正解に近い精度を競います。<br>1オーダー以内で正解なら満点！</p>
      <button onclick="startQuiz()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-8 py-3 rounded-xl text-lg transition">クイズ開始</button>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div id="quizScreen" class="hidden">
    <!-- Progress -->
    <div class="mb-6">
      <div class="flex justify-between text-sm text-indigo-400 mb-2">
        <span>問題 <span id="qNum">1</span> / 20</span>
        <span>スコア: <span id="curScore">0</span> / <span id="maxScore">0</span></span>
      </div>
      <div class="bg-indigo-900 rounded-full h-2">
        <div id="progressBar" class="bg-indigo-400 h-2 rounded-full transition-all" style="width:0%"></div>
      </div>
    </div>

    <!-- Question Card -->
    <div class="bg-indigo-900/60 border border-indigo-700 rounded-xl p-6 mb-6">
      <div class="text-xs text-indigo-500 mb-2" id="qCategory"></div>
      <h2 id="qText" class="text-lg font-bold text-white mb-6"></h2>
      <div class="flex items-center gap-3 mb-4">
        <span class="text-indigo-300 text-lg">10^</span>
        <input id="expInput" type="number" step="0.5" placeholder="例: 5" class="w-32 bg-indigo-800 border border-indigo-600 rounded-lg px-4 py-2 text-xl text-center font-mono focus:outline-none focus:border-indigo-400">
        <span class="text-indigo-500 text-sm">= 10の何乗？</span>
      </div>
      <div class="text-xs text-indigo-600 mb-4">ヒント: 1万 = 10^4, 100万 = 10^6, 10億 = 10^9</div>
      <button onclick="submitAnswer()" id="submitBtn" class="w-full bg-indigo-500 hover:bg-indigo-400 text-white font-bold py-3 rounded-lg transition">回答する</button>
    </div>

    <!-- Feedback (hidden until answer) -->
    <div id="feedback" class="hidden bg-indigo-900/40 border rounded-xl p-5 mb-4">
      <div class="flex justify-between items-start mb-3">
        <div id="feedbackVerdict" class="text-xl font-bold"></div>
        <div id="feedbackPoints" class="text-lg font-bold text-right"></div>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-3 text-sm">
        <div>
          <div class="text-indigo-400 text-xs mb-1">あなたの推定</div>
          <div id="yourEstimate" class="font-mono text-indigo-200"></div>
        </div>
        <div>
          <div class="text-indigo-400 text-xs mb-1">正解</div>
          <div id="correctAnswer" class="font-mono text-white"></div>
        </div>
      </div>
      <div id="explanation" class="text-sm text-indigo-300 border-t border-indigo-800 pt-3"></div>
      <button onclick="nextQuestion()" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-lg transition" id="nextBtn">次の問題 →</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="resultScreen" class="hidden text-center">
    <div class="bg-indigo-900/50 border border-indigo-700 rounded-xl p-8">
      <div class="text-5xl mb-4" id="resultEmoji"></div>
      <h2 id="resultGrade" class="text-2xl font-bold text-indigo-300 mb-2"></h2>
      <div class="text-4xl font-bold text-white mb-4" id="finalScore"></div>
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-indigo-800/50 rounded-lg p-3">
          <div class="text-xs text-indigo-400">完全正解 (±0)</div>
          <div id="exact" class="text-xl font-bold text-green-400"></div>
        </div>
        <div class="bg-indigo-800/50 rounded-lg p-3">
          <div class="text-xs text-indigo-400">1オーダー以内</div>
          <div id="close1" class="text-xl font-bold text-yellow-400"></div>
        </div>
        <div class="bg-indigo-800/50 rounded-lg p-3">
          <div class="text-xs text-indigo-400">2オーダー以内</div>
          <div id="close2" class="text-xl font-bold text-orange-400"></div>
        </div>
      </div>
      <button onclick="startQuiz()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-8 py-3 rounded-xl transition">もう一度挑戦</button>
    </div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const questions = [
  {q:'東京都内の信号機の数は？',cat:'インフラ',exp:5.3,answer:'約20万本（2×10^5）',explain:'東京23区+市部の交差点数≈15,000。各交差点平均4-5機＋歩行者用で約20万台。'},
  {q:'日本の年間ピアノ販売台数は？',cat:'製造・産業',exp:5.4,answer:'約25万台（2.5×10^5）',explain:'日本はピアノ生産大国。国内消費+輸出で年間20-30万台。ヤマハ・カワイの国内シェアが大部分。'},
  {q:'富士山の体積は？(m³)',cat:'地理・科学',exp:11.6,answer:'約4×10^11 m³',explain:'富士山の底面半径≈10km、高さ≈3.8km。円錐形で(1/3)πr²h≈4×10^11 m³。'},
  {q:'日本国内の自動販売機の総台数は？',cat:'経済・消費',exp:6.3,answer:'約300万台（3×10^6）',explain:'日本は世界最密度の自動販売機大国。人口4人に1台のペース（約300万台）。'},
  {q:'地球の表面積は？(m²)',cat:'地理・科学',exp:14.7,answer:'約5.1×10^14 m²',explain:'地球半径≈6,371km。表面積=4πr²=4π×(6.371×10^6)²≈5.1×10^14 m²。'},
  {q:'日本の年間コンビニ来客数（全店舗合計）は？(人)',cat:'経済・消費',exp:10.2,answer:'約150億人（1.5×10^10）',explain:'コンビニ約5.6万店×1日700人×365日≈143億人/年。'},
  {q:'人体の全細胞数は？',cat:'生物・医学',exp:13.9,answer:'約37兆個（3.7×10^13）',explain:'2013年の研究で37.2兆個と推定。赤血球が約70%を占める。'},
  {q:'日本の国土面積は？(m²)',cat:'地理',exp:11.6,answer:'約3.78×10^11 m²',explain:'日本の国土面積≈377,975 km²=3.78×10^11 m²。世界61位。'},
  {q:'地球上の砂粒の総数は？',cat:'天文・地球科学',exp:19,answer:'約7.5×10^18個',explain:'海岸・砂漠・海底の砂を合計。粒径0.5mmとすると研究者推定で約7.5×10^18粒。'},
  {q:'東京→大阪間（新幹線）の乗客が1年間に踏む総歩数は？',cat:'生活・身体',exp:9,answer:'約10^9〜10^10歩',explain:'新幹線乗客年間≈3000万人×駅構内移動500歩×往復=約3×10^10歩。'},
  {q:'日本の年間自動車生産台数は？',cat:'製造・産業',exp:6.9,answer:'約800万台（8×10^6）',explain:'トヨタ・ホンダ等含む国内生産。近年は700-800万台/年。'},
  {q:'インターネット上のウェブページ総数は？',cat:'テクノロジー',exp:12,answer:'約5兆ページ（5×10^12）',explain:'Google が索引するページは数十億だが、ダークウェブ含む推定総数は数兆ページ。'},
  {q:'地球の重さは？(kg)',cat:'天文・地球科学',exp:24.8,answer:'約6×10^24 kg',explain:'地球の質量=5.972×10^24 kg。物理定数として精密に計測済み。'},
  {q:'日本語の語彙数（現代語）は？',cat:'文化・言語',exp:5.5,answer:'約30万語（3×10^5）',explain:'広辞苑は約25万語収録。現代語+専門用語で30万以上とされる。'},
  {q:'人間の髪の毛の総本数は？（一人頭）',cat:'生物・医学',exp:5,answer:'約10万本（10^5）',explain:'平均的な成人の頭皮には約10万本（8-15万本）の毛包がある。'},
  {q:'地球と月の距離は？(m)',cat:'天文',exp:8.6,answer:'約3.84×10^8 m',explain:'平均距離384,400 km=3.844×10^8 m。月の軌道離心率により35-40万kmの間で変動。'},
  {q:'日本国内の全書籍・図書館の蔵書総数は？',cat:'文化',exp:9,answer:'約3-4億冊（3-4×10^8）',explain:'国立国会図書館≈4000万冊+公共図書館+大学図書館。推定2-4億冊規模。'},
  {q:'人体の全DNA塩基対数は？（二倍体ゲノム）',cat:'生物・医学',exp:9.8,answer:'約60億塩基対（6×10^9）',explain:'ヒトゲノムは約30億塩基対（一倍体）。体細胞は二倍体なので×2=60億。'},
  {q:'日本の年間ゴミ排出量（一般廃棄物）は？(トン)',cat:'環境',exp:7.5,answer:'約4000万トン（4×10^7）',explain:'環境省統計：一般廃棄物年間4,000万トン前後（2020年代）。'},
  {q:'宇宙の観測可能な範囲の星の総数は？',cat:'天文',exp:24,answer:'約2×10^23〜10^24個',explain:'推定2兆個の銀河×平均1000億個の星=2×10^23個。最新研究では2×10^24個説も。'},
];

let currentQ = 0;
let scores = [];
let shuffled = [];

function startQuiz() {
  currentQ = 0;
  scores = [];
  shuffled = [...questions].sort(() => Math.random() - 0.5);
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}

function showQuestion() {
  const q = shuffled[currentQ];
  document.getElementById('qNum').textContent = currentQ + 1;
  document.getElementById('curScore').textContent = scores.reduce((a,b)=>a+b,0);
  document.getElementById('maxScore').textContent = (currentQ + 1) * 3;
  document.getElementById('progressBar').style.width = `${currentQ/20*100}%`;
  document.getElementById('qCategory').textContent = q.cat;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('expInput').value = '';
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('submitBtn').classList.remove('hidden');
  document.getElementById('expInput').focus();
}

document.getElementById('expInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitAnswer();
});

function submitAnswer() {
  const val = parseFloat(document.getElementById('expInput').value);
  if (isNaN(val)) { document.getElementById('expInput').classList.add('ring-2','ring-red-500'); setTimeout(()=>document.getElementById('expInput').classList.remove('ring-2','ring-red-500'),1000); return; }

  const q = shuffled[currentQ];
  const diff = Math.abs(val - q.exp);
  let pts = 0, verdict = '', cls = '';

  if (diff < 0.5) { pts = 3; verdict = '🎯 ほぼ完璧！'; cls = 'border-green-600 bg-green-900/20'; }
  else if (diff < 1.0) { pts = 2; verdict = '✅ 1オーダー以内！'; cls = 'border-yellow-600 bg-yellow-900/20'; }
  else if (diff < 2.0) { pts = 1; verdict = '⚡ 2オーダー以内'; cls = 'border-orange-600 bg-orange-900/20'; }
  else { pts = 0; verdict = '❌ 範囲外'; cls = 'border-red-800 bg-red-900/10'; }

  scores.push(pts);

  const fb = document.getElementById('feedback');
  fb.className = `bg-indigo-900/40 border ${cls} rounded-xl p-5 mb-4`;
  fb.classList.remove('hidden');
  document.getElementById('feedbackVerdict').textContent = verdict;
  document.getElementById('feedbackPoints').textContent = `+${pts} / 3点`;
  document.getElementById('feedbackPoints').className = pts === 3 ? 'text-lg font-bold text-right text-green-400' : pts >= 1 ? 'text-lg font-bold text-right text-yellow-400' : 'text-lg font-bold text-right text-red-400';

  const userVal = Math.pow(10, val);
  const correctVal = Math.pow(10, q.exp);
  document.getElementById('yourEstimate').textContent = `10^${val} ≈ ${formatNum(userVal)}`;
  document.getElementById('correctAnswer').textContent = `10^${q.exp} ≈ ${formatNum(correctVal)}`;
  document.getElementById('explanation').textContent = q.explain;

  document.getElementById('submitBtn').classList.add('hidden');
  document.getElementById('curScore').textContent = scores.reduce((a,b)=>a+b,0);

  if (currentQ >= 19) {
    document.getElementById('nextBtn').textContent = '結果を見る';
    document.getElementById('nextBtn').onclick = showResult;
  }
}

function formatNum(n) {
  if (n >= 1e12) return (n/1e12).toFixed(1) + '兆';
  if (n >= 1e8) return (n/1e8).toFixed(1) + '億';
  if (n >= 1e4) return (n/1e4).toFixed(1) + '万';
  return n.toFixed(0);
}

function nextQuestion() {
  currentQ++;
  showQuestion();
}

function showResult() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');

  const total = scores.reduce((a,b)=>a+b,0);
  const max = 60;
  const pct = total/max;

  let grade, emoji;
  if (pct >= 0.9) { grade = '🌟 フェルミ物理学者！'; emoji = '🏆'; }
  else if (pct >= 0.75) { grade = '🔬 サイエンティスト級'; emoji = '🥇'; }
  else if (pct >= 0.6) { grade = '📐 エンジニア思考'; emoji = '🥈'; }
  else if (pct >= 0.4) { grade = '📊 ビジネスマン的'; emoji = '🥉'; }
  else { grade = '📚 まだまだ修行中'; emoji = '📖'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultGrade').textContent = grade;
  document.getElementById('finalScore').textContent = `${total} / ${max}点`;

  const exact = scores.filter(s=>s===3).length;
  const c1 = scores.filter(s=>s===2).length;
  const c2 = scores.filter(s=>s===1).length;
  document.getElementById('exact').textContent = exact;
  document.getElementById('close1').textContent = c1;
  document.getElementById('close2').textContent = c2;
}
</script>
</body>
</html>
